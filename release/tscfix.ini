; Settings of tsc-improvements. The game reads them when it starts.
; 1 = on, 0 = off. A line that starts with ; is a comment.
; A setting that is not in this file has its default value.

[threading]
; Draw the picture on more processor cores. The game update runs first, then the picture work is
; shared between threads.
render=1
; Shadow threads: 2 = the widest shadow map gets its own thread, 1 = one shadow thread.
shadow_threads=2

[fixes]
; Start the game's job threads, as with the -Multicore start option.
multicore=1
; Braked trains that stand still stay fully still.
brake_hold=1
; The cab camera stays exactly still while the train stands (steady signal lenses far away).
camera_rest=1
; More memory for the engine heap (up to what Windows allows) and the sound system (512 MB).
engine_heap_budget=1
; Faster removal of scenery objects when scenery unloads (less stutter).
physics_index=1
; Faster script searches in the entity tree.
entity_search_cache=1
; Skip script calls that show or hide a model part when nothing changes.
node_set_skip=1
; Faster script calls that name a control (GetControlValue and others).
fast_control_lookup=1
; Faster script calls that look up their own object.
script_call_cache=1
qi_cache=1
; Do not time script calls while the script timing overlay is off.
script_timing=1
; Steam rich presence updates are sent off the game thread.
rich_presence_async=1
; Thread-safe counts and locks for objects that the picture threads share.
safe_counts=1
override_lock_all=1
; Effects do not save and restore the full device state.
effect_nosavestate=1

[graphics]
; Cab camera: 0 = fixed to the cab (no sway), 1 = the game's spring.
cab_camera_spring=0
; Sign digits are drawn a little in front of the sign plate (24-bit depth steps, 0 = off).
sign_text_depth_bias=32
; Supersampling: shrink the picture with a better filter.
better_resolve=1
; The game's FXAA pass: -1 = off when the game supersamples, 0 = off, 1 = on.
fxaa=-1
; Bloom and colour: 0 = the game's, 1 = the mod's, 2 = the mod's strong one.
film=1
; The game's depth of field pass.
depth_of_field=1
; Lamp light gets weaker as the scene gets brighter.
lamp_fade=1
; Texture filtering: 0 = the game's value (4), or 8 or 16.
anisotropy=0

[debug]
; Write a record of a crash to tscfix.log.
crash_record=1
